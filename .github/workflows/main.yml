name: Deploy NuGet Package

env:
  PROJECT_PATH: './src/Analyzers/Analyzers.csproj'
  OUTPUT_DIR: 'nupkgs'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.OUTPUT_DIR }}

      - name: Publish
        run: dotnet nuget push ${{ env.OUTPUT_DIR }}/*.nupkg -k ${{ env.NUGET_API_KEY }} -s ${{ env.NUGET_SOURCE }}
